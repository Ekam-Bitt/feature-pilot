# Datastores only. The agent sandbox is created per-run by
# featurepilot.sandbox.runner via the Docker API, not declared here.
services:
  postgres:
    # pgvector ships unused in 1A. Present now so enabling the 1B vector
    # store is a migration, not an image swap.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: featurepilot
      POSTGRES_PASSWORD: featurepilot
      POSTGRES_DB: featurepilot
    ports:
      - "5433:5432" # 5433 to avoid colliding with a local postgres install
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U featurepilot -d featurepilot"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    # Ephemeral pub/sub behind the SSE stream. Postgres remains the durable
    # store, so losing Redis costs live updates, never run state.
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "6380:6379" # 6380 to avoid colliding with a local redis install
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
