[project]
name = "shopsvc"
version = "0.1.0"
description = "Small order service. Deliberately contains seeded defects."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopsvc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
