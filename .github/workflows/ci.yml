# Verifies the claims the README makes.
#
# The offline suite is the whole point of this workflow: 358 tests that need no
# Docker daemon, no Postgres, no Redis and no API key, because every seam is
# exercised against a fake `ToolRegistry` and a stub `Retriever`. If a node can
# only be tested with a live container, the abstraction is decorative — so the
# constraint that makes CI cheap is the same constraint that keeps the design
# honest. 8 of the 358 skip here: they need a fixture virtualenv that is not
# committed, so CI reports 350 passed, 8 skipped.
#
# Deliberately excluded, each needing something CI deliberately does not have:
#   -m docker    a daemon, and a 387 MB image build
#   -m postgres  the compose datastore
#   -m llm       real money
# All three are run locally before a release. Adding service containers here
# would buy coverage at the cost of the property that makes this file cheap and
# fast, and the gated suites are the ones whose failures are loud anyway.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push mid-run should cancel the superseded run rather than queue behind
# it. The event name is part of the group deliberately: without it, running this
# workflow by hand cancels an in-flight push run for the same ref — and the push
# run is the one the README badge reflects, so a manual check would quietly
# destroy the result of record.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Pinned exactly: setup-uv publishes no moving `v9` tag, only `v9.0.0`.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Reads .python-version (3.13) and installs that interpreter exactly.
      - name: Install Python
        run: uv python install

      # --frozen fails rather than silently resolving something new, so CI can
      # never pass against a dependency set the lockfile does not describe.
      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # src *and* eval: an evaluation harness that miscounts is worse than no
      # harness, and three scoring bugs in this project's history were silent.
      - name: Types
        run: uv run mypy src eval

      - name: Tests
        run: uv run pytest
