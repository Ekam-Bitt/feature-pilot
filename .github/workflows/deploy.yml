# Confirms that main reached the host.
#
# It does not deploy. The host deploys itself: a systemd timer runs
# `deploy/scripts/self-deploy.sh`, which resets to main, syncs, and restarts.
# That is pull-based on purpose — the host's SSH is open to a single address,
# and a GitHub runner is never at it. The alternative was opening port 22 to
# the internet so a runner could reach in, which trades a real reduction in
# exposure for a nicer status badge.
#
# So this job watches the outcome instead, through the HTTPS the host already
# serves, and fails loudly if the commit never appears. `/health` reports the
# commit it is running for exactly this reason.
#
# Vercel deploys the frontend itself on push, and builds a preview per pull
# request, which is why nothing here mentions it.

name: deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "docker-compose.yml"
      - "scripts/init.sql"
      - "deploy/scripts/self-deploy.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-host
  cancel-in-progress: false

jobs:
  landed:
    name: main is live on the host
    runs-on: ubuntu-latest
    # Generous: the timer's period, plus a dependency sync and a restart.
    timeout-minutes: 12

    steps:
      - name: Wait for the host to be running this commit
        run: |
          api="${{ vars.FP_API_URL }}"
          if [ -z "$api" ]; then
            echo "FP_API_URL is not set as a repository variable, so there is" >&2
            echo "nothing to check. Set it to the host's public URL." >&2
            exit 1
          fi

          echo "waiting for $api to report ${GITHUB_SHA:0:9}"
          for attempt in $(seq 1 60); do
            live=$(curl -sf --max-time 10 "$api/health" | python3 -c \
              'import json,sys; print(json.load(sys.stdin).get("commit") or "")' 2>/dev/null || true)

            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "live after ${attempt} check(s)"
              exit 0
            fi
            echo "  ${attempt}: host is on ${live:0:9}"
            sleep 10
          done

          cat >&2 <<MSG
          The host never reported this commit.

          It deploys itself on a timer, so the usual causes are that the timer
          is not running, or that the deploy failed. On the host:

            systemctl status featurepilot-deploy.timer
            journalctl -u featurepilot-deploy -n 50
          MSG
          exit 1

      - name: Say what is live
        if: always()
        run: |
          api="${{ vars.FP_API_URL }}"
          {
            echo "### Host"
            echo ""
            echo '```json'
            curl -sf --max-time 10 "$api/health" || echo '{"status":"unreachable"}'
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
